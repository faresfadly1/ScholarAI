name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      app_url:
        description: Verified HTTPS application origin (optional; uses PUBLIC_APP_URL repository variable)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_APP_URL: ${{ inputs.app_url || vars.PUBLIC_APP_URL }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        if: env.PUBLIC_APP_URL == ''
        run: npm ci
      - name: Build project page while production hosting is pending
        if: env.PUBLIC_APP_URL == ''
        env:
          GITHUB_PAGES: "true"
        run: npm run build
      - name: Publish the entry point to the working application
        if: env.PUBLIC_APP_URL != ''
        run: node scripts/build-pages-redirect.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
