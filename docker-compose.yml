name: scholarai
x-api-env: &api-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  DATABASE_URL: postgresql+psycopg://scholarai:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/scholarai
  REDIS_URL: redis://redis:6379/0
  APP_URL: ${APP_URL:-http://localhost:3000}
  JWT_SECRET: ${JWT_SECRET:-}
  TASK_MODE: celery
  STORAGE_BACKEND: s3
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-scholarai-local}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-local-storage-development-only}
  S3_BUCKET: ${S3_BUCKET:-scholarai}
  LLM_PROVIDER: ${LLM_PROVIDER:-mock}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
  LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-}
  LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-noreply@scholarai.example}
  DEMO_PASSWORD: ${DEMO_PASSWORD:-ScholarDemo!2027}
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: scholarai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: scholarai
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U scholarai -d scholarai"]
      interval: 5s
      timeout: 5s
      retries: 15
  redis:
    image: redis:8-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-scholarai-local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-local-storage-development-only}
    volumes: [minio_data:/data]
    ports: ['127.0.0.1:9001:9001']
  storage-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on: [minio]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-scholarai-local}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-local-storage-development-only}
      S3_BUCKET: ${S3_BUCKET:-scholarai}
    entrypoint: [/bin/sh, -c]
    command:
      - |
        until mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"; do sleep 2; done
        mc mb --ignore-existing "local/$$S3_BUCKET"
        mc anonymous set none "local/$$S3_BUCKET"
  migrate:
    build: {context: ., dockerfile: infra/docker/api.Dockerfile}
    environment: *api-env
    command: [alembic, upgrade, head]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    build: {context: ., dockerfile: infra/docker/api.Dockerfile}
    environment: *api-env
    volumes: [mail_data:/app/.data/mail]
    depends_on:
      migrate: {condition: service_completed_successfully}
      storage-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    build: {context: ., dockerfile: infra/docker/api.Dockerfile}
    environment: *api-env
    command: [celery, -A, app.tasks.queue.celery_app, worker, --loglevel=INFO, --concurrency=2]
    depends_on:
      api: {condition: service_healthy}
  web:
    build: {context: ., dockerfile: infra/docker/web.Dockerfile}
    environment:
      API_INTERNAL_URL: http://api:8000
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      api: {condition: service_healthy}
  nginx:
    image: nginx:stable-alpine
    profiles: [proxy]
    ports: ['127.0.0.1:8080:80']
    volumes: ['./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro']
    depends_on: [web]
volumes:
  postgres_data:
  redis_data:
  minio_data:
  mail_data:
