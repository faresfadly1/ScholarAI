services:
  - type: web
    name: scholarai-faresfadly1-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./infra/docker/api.Dockerfile
    dockerContext: .
    dockerCommand: /app/start-free.sh
    healthCheckPath: /ready
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: FREE_DEPLOYMENT_MODE
        value: "true"
      - key: APP_URL
        sync: false
      - key: INTERNAL_PROXY_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: TASK_MODE
        value: local
      - key: REDIS_URL
        value: ""
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: eu-central-1
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        value: scholarai-private
      - key: EMBEDDING_DIMENSIONS
        value: "1536"
      - key: MAX_UPLOAD_MB
        value: "4"
      - key: LLM_PROVIDER
        value: gemini
      - key: JWT_SECRET
        generateValue: true
